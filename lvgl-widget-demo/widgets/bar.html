<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVGL Bar 复刻与导出</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='12' width='24' height='8' rx='4' fill='%23e3e6ea'/%3E%3Crect x='4' y='12' width='15' height='8' rx='4' fill='%232b7de9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/panel.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>LVGL Bar 本地复刻</h1>
    <p>三种模式（正常 / 对称 / 区间）、两种方向、粗细与圆角实时可调，参数对齐 <code>lv_bar_set_value()</code> / <code>lv_bar_set_mode()</code>，可直接导出 GIF / WebM 留档。</p>
  </header>

  <div class="stage">
    <div class="stage-canvas-box"><canvas id="view"></canvas></div>
  </div>

  <section class="panel">
    <h2>参数（对应 LVGL 接口）</h2>
    <div class="grid">
      <div class="field">
        <label>模式 set_mode</label>
        <div class="seg" id="mode">
          <button type="button" data-mode="normal" class="active">正常</button>
          <button type="button" data-mode="sym">对称</button>
          <button type="button" data-mode="range">区间</button>
        </div>
      </div>
      <div class="field">
        <label>方向 orientation</label>
        <div class="seg" id="dir">
          <button type="button" data-dir="h" class="active">水平</button>
          <button type="button" data-dir="v">垂直</button>
        </div>
      </div>

      <div class="field">
        <label>当前值 value <output id="o-value">65</output></label>
        <input type="range" id="value" min="0" max="100" step="1" value="65">
      </div>
      <div class="field">
        <label>起始值 start_value <output id="o-start">20</output></label>
        <input type="range" id="start" min="0" max="100" step="1" value="20">
      </div>

      <div class="field">
        <label>最小值 min <output id="o-min">0</output></label>
        <input type="range" id="min" min="0" max="100" step="1" value="0">
      </div>
      <div class="field">
        <label>最大值 max <output id="o-max">100</output></label>
        <input type="range" id="max" min="100" max="255" step="1" value="100">
      </div>

      <div class="field">
        <label>粗细 thickness <output id="o-thick">14 px</output></label>
        <input type="range" id="thick" min="4" max="48" step="1" value="14">
      </div>
      <div class="field">
        <label>圆角 radius <output id="o-radius">100%</output></label>
        <input type="range" id="radius" min="0" max="100" step="1" value="100">
      </div>

      <div class="field">
        <label>指示条颜色 INDICATOR</label>
        <input type="color" id="indic" value="#2b7de9">
      </div>
      <div class="field">
        <label>轨道颜色 MAIN</label>
        <input type="color" id="track" value="#e3e6ea">
      </div>

      <div class="field">
        <label>单程时长 <output id="o-duration">1200 ms</output></label>
        <input type="range" id="duration" min="300" max="4000" step="50" value="1200">
      </div>
      <div class="field">
        <label>自动演示</label>
        <div class="check"><input type="checkbox" id="auto" checked><span>数值在 min~max 之间来回</span></div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="btn-gif">导出 GIF（一个来回）</button>
      <button type="button" class="btn" id="btn-webm">录制 WebM（一个来回）</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <pre class="code" id="code"></pre>

  <footer>GIF 编码由 gif.js（jsDelivr CDN）完成，需联网；WebM 使用浏览器原生 MediaRecorder，离线可用。画布上可直接左右（上下）拖动改值。</footer>
</div>

<script>
(function(){
  "use strict";

  var state = {
    mode: "normal",     // normal | sym | range
    dir: "h",           // h | v
    value: 65,
    start: 20,
    min: 0,
    max: 100,
    thickness: 14,
    radius: 100,        // 百分比
    indic: "#2b7de9",
    track: "#e3e6ea",
    auto: true,
    duration: 1200
  };

  var LEN = 280;              // 进度条长度（固定）
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var statusEl = document.getElementById("status");
  var t0 = performance.now();

  /* ---------- 工具 ---------- */
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function roundRect(c, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    if(r < 0) r = 0;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function metrics(){
    return state.dir === "h"
      ? { w: LEN, h: state.thickness }
      : { w: state.thickness, h: LEN };
  }

  /* 归一化位置 0..1 */
  function ratio(v){
    var span = state.max - state.min;
    if(span <= 0) return 0;
    return clamp((v - state.min) / span, 0, 1);
  }

  /* 自动演示时，t 时刻的数值 */
  function valueAt(t){
    if(!state.auto) return state.value;
    var cycle = state.duration * 2;
    var p = (t % cycle) / cycle;
    var k = p < 0.5 ? p * 2 : (1 - p) * 2;
    return state.min + k * (state.max - state.min);
  }

  /* ---------- 绘制 ---------- */
  function draw(c, tMs){
    var m = metrics();
    var W = m.w, H = m.h;

    c.clearRect(0, 0, W, H);

    /* 轨道 */
    var r = (state.radius / 100) * Math.min(W, H) / 2;
    roundRect(c, 0, 0, W, H, r);
    c.fillStyle = state.track;
    c.fill();

    /* 计算填充区间 */
    var v = valueAt(tMs);
    var pv = ratio(v);
    var pa = pv, pb = pv;

    if(state.mode === "normal"){
      pa = 0; pb = pv;
    }else if(state.mode === "sym"){
      pa = Math.min(0.5, pv);
      pb = Math.max(0.5, pv);
    }else{ /* range */
      var ps = ratio(state.start);
      pa = Math.min(ps, pv);
      pb = Math.max(ps, pv);
    }

    if(pb - pa > 0.0001){
      var ir = Math.min(r, Math.min(W, H) / 2);
      if(state.dir === "h"){
        var x = pa * W;
        var w = (pb - pa) * W;
        roundRect(c, x, 0, w, H, ir);
      }else{
        var y = H - pb * H;
        var h = (pb - pa) * H;
        roundRect(c, 0, y, W, h, ir);
      }
      c.fillStyle = state.indic;
      c.fill();
    }
  }

  /* ---------- 高清适配 + 主循环 ---------- */
  function fitCanvas(){
    var m = metrics();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = m.w * dpr;
    canvas.height = m.h * dpr;
    canvas.style.width = m.w + "px";
    canvas.style.height = m.h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.cursor = state.dir === "h" ? "ew-resize" : "ns-resize";
  }

  function loop(now){
    draw(ctx, now - t0);
    if(state.auto) syncValueUI(valueAt(now - t0));
    requestAnimationFrame(loop);
  }

  /* ---------- UI 同步 ---------- */
  function syncValueUI(v){
    var n = Math.round(v);
    document.getElementById("o-value").textContent = n;
    document.getElementById("value").value = n;
  }

  function renderCode(){
    var m = metrics();
    var hex = function(c){ return "0x" + c.replace("#", ""); };
    var L = [];

    L.push('<span class="cm">/* 由页面参数实时生成 */</span>');
    L.push('lv_obj_t * bar = <span class="fn">lv_bar_create</span>(lv_screen_active());');
    L.push('<span class="fn">lv_obj_set_size</span>(bar, <span class="num">' + m.w + '</span>, <span class="num">' + m.h + '</span>);');
    L.push('<span class="fn">lv_obj_center</span>(bar);');

    if(state.dir === "v"){
      L.push('<span class="fn">lv_bar_set_orientation</span>(bar, LV_BAR_ORIENTATION_VERTICAL);');
    }
    if(state.mode === "sym"){
      L.push('<span class="fn">lv_bar_set_mode</span>(bar, LV_BAR_MODE_SYMMETRICAL);');
    }else if(state.mode === "range"){
      L.push('<span class="fn">lv_bar_set_mode</span>(bar, LV_BAR_MODE_RANGE);');
      L.push('<span class="fn">lv_bar_set_start_value</span>(bar, <span class="num">' + state.start + '</span>, LV_ANIM_OFF);');
    }

    L.push('<span class="fn">lv_bar_set_range</span>(bar, <span class="num">' + state.min + '</span>, <span class="num">' + state.max + '</span>);');
    L.push('<span class="fn">lv_bar_set_value</span>(bar, <span class="num">' + Math.round(state.value) + '</span>, LV_ANIM_ON);');

    var radiusArg = state.radius >= 100 ? "LV_RADIUS_CIRCLE" : state.radius;
    L.push('<span class="fn">lv_obj_set_style_radius</span>(bar, <span class="num">' + radiusArg + '</span>, LV_PART_MAIN);');
    L.push('<span class="fn">lv_obj_set_style_bg_color</span>(bar, <span class="fn">lv_color_hex</span>(<span class="num">' + hex(state.track) + '</span>), LV_PART_MAIN);');
    L.push('<span class="fn">lv_obj_set_style_bg_color</span>(bar, <span class="fn">lv_color_hex</span>(<span class="num">' + hex(state.indic) + '</span>), LV_PART_INDICATOR);');
    L.push('<span class="fn">lv_obj_set_style_radius</span>(bar, <span class="num">' + radiusArg + '</span>, LV_PART_INDICATOR);');

    document.getElementById("code").innerHTML = L.join("\n");
  }

  /* ---------- 控件绑定 ---------- */
  function setStatus(msg, ok){
    statusEl.textContent = msg;
    statusEl.className = "status" + (ok ? " ok" : "");
  }

  function bindRange(id, key, outId, fmt){
    var el = document.getElementById(id);
    var out = document.getElementById(outId);
    el.addEventListener("input", function(){
      state[key] = Number(el.value);
      if(key === "min" || key === "max"){
        /* 保证 min < max */
        if(state.min >= state.max) state.max = state.min + 1;
        document.getElementById("o-min").textContent = state.min;
        document.getElementById("o-max").textContent = state.max;
      }else{
        out.textContent = fmt(Number(el.value));
      }
      /* 手动调值即视为接管演示，关掉自动循环 */
      if(key === "value"){
        state.auto = false;
        document.getElementById("auto").checked = false;
      }
      if(key === "thick") fitCanvas();
      renderCode();
    });
  }

  bindRange("value",   "value",   "o-value",   function(v){ return v; });
  bindRange("start",   "start",   "o-start",   function(v){ return v; });
  bindRange("min",     "min",     "o-min",     function(v){ return v; });
  bindRange("max",     "max",     "o-max",     function(v){ return v; });
  bindRange("thick",   "thickness","o-thick",  function(v){ return v + " px"; });
  bindRange("radius",  "radius",  "o-radius",  function(v){ return v + "%"; });
  bindRange("duration","duration","o-duration",function(v){ return v + " ms"; });

  document.getElementById("indic").addEventListener("input", function(e){
    state.indic = e.target.value; renderCode();
  });
  document.getElementById("track").addEventListener("input", function(e){
    state.track = e.target.value; renderCode();
  });
  document.getElementById("auto").addEventListener("change", function(e){
    state.auto = e.target.checked;
    if(!state.auto) syncValueUI(state.value);
  });

  document.getElementById("mode").addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;
    state.mode = btn.dataset.mode;
    this.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b === btn); });
    renderCode();
  });

  document.getElementById("dir").addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;
    state.dir = btn.dataset.dir;
    this.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b === btn); });
    fitCanvas();
    renderCode();
  });

  /* ---------- 画布拖动改值 ---------- */
  (function(){
    var dragging = false;
    function apply(e){
      var r = canvas.getBoundingClientRect();
      var p = state.dir === "h"
        ? (e.clientX - r.left) / r.width
        : 1 - (e.clientY - r.top) / r.height;
      p = clamp(p, 0, 1);
      state.value = Math.round(state.min + p * (state.max - state.min));
      syncValueUI(state.value);
      state.auto = false;
      document.getElementById("auto").checked = false;
      renderCode();
    }
    canvas.addEventListener("pointerdown", function(e){
      dragging = true;
      canvas.setPointerCapture(e.pointerId);
      apply(e);
    });
    canvas.addEventListener("pointermove", function(e){
      if(dragging) apply(e);
    });
    canvas.addEventListener("pointerup", function(){ dragging = false; });
    canvas.addEventListener("pointercancel", function(){ dragging = false; });
  })();

  /* ---------- 下载 ---------- */
  function download(blob, name){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  /* ---------- GIF 导出 ---------- */
  var gifLib = null;
  function loadGif(){
    if(gifLib) return Promise.resolve(gifLib);
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://fastly.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js";
      s.onload = function(){ gifLib = window.GIF; resolve(gifLib); };
      s.onerror = function(){ reject(new Error("gif.js 加载失败（需联网），可改用 WebM")); };
      document.head.appendChild(s);
    });
  }

  document.getElementById("btn-gif").addEventListener("click", function(){
    var btn = this;
    btn.disabled = true;
    setStatus("加载 GIF 编码器…");
    var m = metrics();
    loadGif().then(function(GIF){
      var fps = 20;
      var cycle = state.duration * 2;
      var frames = Math.max(2, Math.round(cycle / 1000 * fps));
      var workerUrl = "https://fastly.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js";
      var gif = new GIF({ workers: 2, quality: 10, width: m.w, height: m.h, workerScript: workerUrl });
      var off = document.createElement("canvas");
      off.width = m.w; off.height = m.h;
      var octx = off.getContext("2d");
      var i = 0;
      var prevAuto = state.auto;
      state.auto = true;

      function step(){
        if(i < frames){
          draw(octx, i / fps * 1000);
          gif.addFrame(off, { delay: Math.round(1000 / fps), copy: true });
          setStatus("渲染帧 " + (i + 1) + "/" + frames);
          i++;
          setTimeout(step, 0);
        }else{
          gif.on("finished", function(blob){
            state.auto = prevAuto;
            download(blob, "bar.gif");
            setStatus("GIF 已保存：" + frames + " 帧 / " + fps + "fps", true);
            btn.disabled = false;
          });
          gif.on("progress", function(p){ setStatus("编码 GIF " + Math.round(p * 100) + "%"); });
          gif.render();
        }
      }
      step();
    }).catch(function(err){
      setStatus(err.message);
      btn.disabled = false;
    });
  });

  /* ---------- WebM 录制（原生，离线可用） ---------- */
  document.getElementById("btn-webm").addEventListener("click", function(){
    var btn = this;
    if(!canvas.captureStream || typeof MediaRecorder === "undefined"){
      setStatus("当前浏览器不支持 MediaRecorder，请用 Chrome/Edge");
      return;
    }
    btn.disabled = true;
    var prevAuto = state.auto;
    state.auto = true;
    var cycle = state.duration * 2;

    var stream = canvas.captureStream(30);
    var rec = new MediaRecorder(stream, { mimeType: "video/webm" });
    var chunks = [];
    rec.ondataavailable = function(e){ if(e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      state.auto = prevAuto;
      download(new Blob(chunks, { type: "video/webm" }), "bar.webm");
      setStatus("WebM 已保存（一个来回 " + cycle + " ms）", true);
      btn.disabled = false;
    };
    setStatus("录制中，约 " + Math.round(cycle / 1000) + " 秒…");
    rec.start();
    setTimeout(function(){ rec.stop(); }, cycle);
  });

  fitCanvas();
  renderCode();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
