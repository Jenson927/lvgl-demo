<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVGL Arc 复刻与导出</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e3e6ea' stroke-width='6'/%3E%3Cpath d='M16 5a11 11 0 0 1 9.5 16.5' fill='none' stroke='%232b7de9' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/panel.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>LVGL Arc 本地复刻</h1>
    <p>起始角 / 结束角、线宽、颜色与圆头线帽实时可调，参数对齐 <code>lv_arc_set_bg_angles()</code> / <code>lv_arc_set_value()</code>，可直接导出 GIF / WebM 留档。</p>
  </header>

  <div class="stage">
    <div class="stage-canvas-box"><canvas id="view"></canvas></div>
  </div>

  <section class="panel">
    <h2>参数（对应 LVGL 接口）</h2>
    <div class="grid">
      <div class="field">
        <label>起始角 start_angle <output id="o-start">135°</output></label>
        <input type="range" id="start-angle" min="0" max="360" step="1" value="135">
      </div>
      <div class="field">
        <label>结束角 end_angle <output id="o-end">45°</output></label>
        <input type="range" id="end-angle" min="0" max="360" step="1" value="45">
      </div>

      <div class="field">
        <label>当前值 value <output id="o-value">60</output></label>
        <input type="range" id="value" min="0" max="100" step="1" value="60">
      </div>
      <div class="field">
        <label>线宽 arc_width <output id="o-width">18 px</output></label>
        <input type="range" id="width" min="4" max="40" step="1" value="18">
      </div>

      <div class="field">
        <label>最小值 min <output id="o-min">0</output></label>
        <input type="range" id="min" min="0" max="100" step="1" value="0">
      </div>
      <div class="field">
        <label>最大值 max <output id="o-max">100</output></label>
        <input type="range" id="max" min="0" max="200" step="1" value="100">
      </div>

      <div class="field">
        <label>进度弧颜色 INDICATOR</label>
        <input type="color" id="color" value="#2b7de9">
      </div>
      <div class="field">
        <label>底环颜色 MAIN</label>
        <input type="color" id="bg" value="#e3e6ea">
      </div>

      <div class="field">
        <label>圆头线帽 LV_STYLE_LINE_CAP</label>
        <div class="check"><input type="checkbox" id="cap" checked><span>弧线两端使用圆头</span></div>
      </div>
      <div class="field">
        <label>显示旋钮 LV_PART_KNOB</label>
        <div class="check"><input type="checkbox" id="knob" checked><span>在进度弧末端画端点旋钮</span></div>
      </div>

      <div class="field">
        <label>自动往返演示</label>
        <div class="check"><input type="checkbox" id="auto" checked><span>数值在 min~max 之间来回</span></div>
      </div>
      <div class="field">
        <label>拖动模式</label>
        <div class="check"><input type="checkbox" id="drag"><span>在画布上按住拖动改值</span></div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="btn-gif">导出 GIF（一个来回）</button>
      <button type="button" class="btn" id="btn-webm">录制 WebM（一个来回）</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <pre class="code" id="code"></pre>

  <footer>角度约定与 LVGL 一致：0° 在 3 点钟方向，角度顺时针增长。GIF 编码由 gif.js（jsDelivr CDN）完成，需联网；WebM 使用浏览器原生 MediaRecorder，离线可用。</footer>
</div>

<script>
(function(){
  "use strict";

  var SIZE = 280;           // 画布边长
  var RADIUS = 100;         // 弧线中心线半径
  var DURATION = 1600;      // 单程时长（自动演示）

  var state = {
    start: 135,
    end: 45,
    value: 60,
    min: 0,
    max: 100,
    arcWidth: 18,
    color: "#2b7de9",
    bg: "#e3e6ea",
    cap: true,
    knob: true,
    auto: true,
    drag: false
  };

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var statusEl = document.getElementById("status");
  var t0 = performance.now();

  /* ---------- 工具 ---------- */
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function rad(d){ return d * Math.PI / 180; }
  function normDeg(d){ return ((d % 360) + 360) % 360; }

  /* 起始角到结束角之间的顺时针扫过角度 */
  function sweep(){
    var s = state.end - state.start;
    while(s <= 0) s += 360;
    return s;
  }

  function ratio(v){
    var span = state.max - state.min;
    if(span <= 0) return 0;
    return clamp((v - state.min) / span, 0, 1);
  }

  /* 自动演示时，t 时刻的数值 */
  function valueAt(t){
    if(!state.auto) return state.value;
    var cycle = DURATION * 2;
    var p = (t % cycle) / cycle;
    var k = p < 0.5 ? p * 2 : (1 - p) * 2;
    return state.min + k * (state.max - state.min);
  }

  /* 当前值对应的指示器角度 */
  function indAngle(v){
    return state.start + sweep() * ratio(v);
  }

  /* ---------- 绘制 ---------- */
  function draw(c, tMs){
    var cx = SIZE / 2, cy = SIZE / 2;

    c.clearRect(0, 0, SIZE, SIZE);
    c.lineCap = state.cap ? "round" : "butt";

    /* 底环 MAIN */
    c.beginPath();
    c.arc(cx, cy, RADIUS, rad(state.start), rad(state.start + sweep()), false);
    c.strokeStyle = state.bg;
    c.lineWidth = state.arcWidth;
    c.stroke();

    /* 进度弧 INDICATOR */
    var v = valueAt(tMs);
    var p = ratio(v);
    var ai = indAngle(v);

    if(p > 0.002){
      c.beginPath();
      c.arc(cx, cy, RADIUS, rad(state.start), rad(ai), false);
      c.strokeStyle = state.color;
      c.lineWidth = state.arcWidth;
      c.stroke();
    }

    /* 端点旋钮 KNOB */
    if(state.knob){
      var kx = cx + RADIUS * Math.cos(rad(ai));
      var ky = cy + RADIUS * Math.sin(rad(ai));
      var kr = Math.max(7, state.arcWidth / 2 + 4);
      c.beginPath();
      c.arc(kx, ky, kr, 0, Math.PI * 2);
      c.fillStyle = "#ffffff";
      c.fill();
      c.lineWidth = 2;
      c.strokeStyle = state.color;
      c.stroke();
    }

    /* 中心数值 */
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillStyle = "#1c2128";
    c.font = '600 34px ui-monospace, Consolas, "Liberation Mono", monospace';
    c.fillText(String(Math.round(v)), cx, cy - 2);
    c.fillStyle = "#8a929c";
    c.font = '12px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
    c.fillText("min " + state.min + " / max " + state.max, cx, cy + 28);
  }

  /* ---------- 高清适配 + 主循环 ---------- */
  function fitCanvas(){
    var dpr = window.devicePixelRatio || 1;
    canvas.width = SIZE * dpr;
    canvas.height = SIZE * dpr;
    canvas.style.width = SIZE + "px";
    canvas.style.height = SIZE + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.cursor = state.drag ? "crosshair" : "default";
  }

  function loop(now){
    draw(ctx, now - t0);
    if(state.auto) syncValueUI(valueAt(now - t0));
    requestAnimationFrame(loop);
  }

  /* ---------- UI 同步 ---------- */
  function syncValueUI(v){
    var n = Math.round(v);
    if(n !== state.value){
      state.value = n;
      renderCode();
    }
    document.getElementById("o-value").textContent = n;
    document.getElementById("value").value = n;
  }

  function syncRangeUI(){
    document.getElementById("o-min").textContent = state.min;
    document.getElementById("o-max").textContent = state.max;
    document.getElementById("min").value = state.min;
    document.getElementById("max").value = state.max;
    var el = document.getElementById("value");
    el.min = state.min;
    el.max = state.max;
    el.value = Math.round(state.value);
    document.getElementById("o-value").textContent = Math.round(state.value);
  }

  function renderCode(){
    var s = normDeg(Math.round(state.start));
    var e = normDeg(Math.round(state.end));
    var ai = normDeg(Math.round(indAngle(state.value)));
    var hex = function(c){ return "0x" + c.replace("#", ""); };
    var L = [];

    L.push('<span class="cm">/* 由页面参数实时生成 */</span>');
    L.push('lv_obj_t * arc = <span class="fn">lv_arc_create</span>(lv_screen_active());');
    L.push('<span class="fn">lv_obj_set_size</span>(arc, <span class="num">' + SIZE + '</span>, <span class="num">' + SIZE + '</span>);');
    L.push('<span class="fn">lv_obj_center</span>(arc);');
    L.push('<span class="fn">lv_arc_set_bg_angles</span>(arc, <span class="num">' + s + '</span>, <span class="num">' + e + '</span>);');
    L.push('<span class="fn">lv_arc_set_range</span>(arc, <span class="num">' + state.min + '</span>, <span class="num">' + state.max + '</span>);');
    L.push('<span class="fn">lv_arc_set_value</span>(arc, <span class="num">' + Math.round(state.value) + '</span>);');
    L.push('<span class="cm">/* 可选：直接指定指示器角度（会覆盖 value） */</span>');
    L.push('<span class="fn">lv_arc_set_angles</span>(arc, <span class="num">' + s + '</span>, <span class="num">' + ai + '</span>);');

    if(!state.knob){
      L.push('<span class="fn">lv_obj_remove_style</span>(arc, NULL, LV_PART_KNOB);');
    }

    L.push('<span class="fn">lv_obj_set_style_arc_width</span>(arc, <span class="num">' + state.arcWidth + '</span>, LV_PART_MAIN);');
    L.push('<span class="fn">lv_obj_set_style_arc_width</span>(arc, <span class="num">' + state.arcWidth + '</span>, LV_PART_INDICATOR);');
    L.push('<span class="fn">lv_obj_set_style_arc_color</span>(arc, <span class="fn">lv_color_hex</span>(<span class="num">' + hex(state.bg) + '</span>), LV_PART_MAIN);');
    L.push('<span class="fn">lv_obj_set_style_arc_color</span>(arc, <span class="fn">lv_color_hex</span>(<span class="num">' + hex(state.color) + '</span>), LV_PART_INDICATOR);');
    L.push('<span class="fn">lv_obj_set_style_arc_rounded</span>(arc, <span class="num">' + (state.cap ? "true" : "false") + '</span>, LV_PART_INDICATOR);');

    document.getElementById("code").innerHTML = L.join("\n");
  }

  /* ---------- 控件绑定 ---------- */
  function setStatus(msg, ok){
    statusEl.textContent = msg;
    statusEl.className = "status" + (ok ? " ok" : "");
  }

  function bindRange(id, key, outId, fmt){
    var el = document.getElementById(id);
    var out = document.getElementById(outId);
    el.addEventListener("input", function(){
      state[key] = Number(el.value);

      if(key === "min" || key === "max"){
        /* 保证 min < max，并在滑杆范围内 */
        state.min = clamp(state.min, 0, 200);
        state.max = clamp(state.max, 0, 200);
        if(state.min >= state.max){
          if(key === "min") state.min = state.max - 1;
          else state.max = state.min + 1;
        }
        state.value = clamp(state.value, state.min, state.max);
        syncRangeUI();
      }else if(key === "value"){
        syncValueUI(state.value);
      }else{
        out.textContent = fmt(Number(el.value));
      }

      /* 手动调值即视为接管演示，关掉自动循环 */
      if(key === "value"){
        state.auto = false;
        document.getElementById("auto").checked = false;
      }
      renderCode();
    });
  }

  bindRange("start-angle", "start",  "o-start",  function(v){ return v + "°"; });
  bindRange("end-angle",   "end",    "o-end",    function(v){ return v + "°"; });
  bindRange("value",       "value",  "o-value",  function(v){ return v; });
  bindRange("width",       "arcWidth","o-width", function(v){ return v + " px"; });
  bindRange("min",         "min",    "o-min",    function(v){ return v; });
  bindRange("max",         "max",    "o-max",    function(v){ return v; });

  document.getElementById("color").addEventListener("input", function(e){
    state.color = e.target.value; renderCode();
  });
  document.getElementById("bg").addEventListener("input", function(e){
    state.bg = e.target.value; renderCode();
  });
  document.getElementById("cap").addEventListener("change", function(e){
    state.cap = e.target.checked; renderCode();
  });
  document.getElementById("knob").addEventListener("change", function(e){
    state.knob = e.target.checked; renderCode();
  });
  document.getElementById("auto").addEventListener("change", function(e){
    state.auto = e.target.checked;
    if(!state.auto) syncValueUI(state.value);
  });
  document.getElementById("drag").addEventListener("change", function(e){
    state.drag = e.target.checked;
    fitCanvas();
  });

  /* ---------- 画布拖动改值 ---------- */
  (function(){
    var dragging = false;

    function angleAt(e){
      var r = canvas.getBoundingClientRect();
      var x = e.clientX - r.left - SIZE / 2;
      var y = e.clientY - r.top - SIZE / 2;
      return normDeg(Math.atan2(y, x) * 180 / Math.PI);
    }

    function apply(e){
      var a = angleAt(e);
      var rel = normDeg(a - state.start);
      if(rel > sweep()) return;               /* 落在缺口里，忽略 */
      var p = rel / sweep();
      state.value = Math.round(state.min + p * (state.max - state.min));
      syncValueUI(state.value);
      state.auto = false;
      document.getElementById("auto").checked = false;
      renderCode();
    }

    canvas.addEventListener("pointerdown", function(e){
      if(!state.drag) return;
      dragging = true;
      canvas.setPointerCapture(e.pointerId);
      apply(e);
    });
    canvas.addEventListener("pointermove", function(e){
      if(dragging) apply(e);
    });
    canvas.addEventListener("pointerup", function(){ dragging = false; });
    canvas.addEventListener("pointercancel", function(){ dragging = false; });
  })();

  /* ---------- 下载 ---------- */
  function download(blob, name){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  /* ---------- GIF 导出 ---------- */
  var gifLib = null;
  function loadGif(){
    if(gifLib) return Promise.resolve(gifLib);
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://fastly.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js";
      s.onload = function(){ gifLib = window.GIF; resolve(gifLib); };
      s.onerror = function(){ reject(new Error("gif.js 加载失败（需联网），可改用 WebM")); };
      document.head.appendChild(s);
    });
  }

  document.getElementById("btn-gif").addEventListener("click", function(){
    var btn = this;
    btn.disabled = true;
    setStatus("加载 GIF 编码器…");
    loadGif().then(function(GIF){
      var fps = 20;
      var cycle = DURATION * 2;
      var frames = Math.max(2, Math.round(cycle / 1000 * fps));
      var workerUrl = "https://fastly.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js";
      var gif = new GIF({ workers: 2, quality: 10, width: SIZE, height: SIZE, workerScript: workerUrl });
      var off = document.createElement("canvas");
      off.width = SIZE; off.height = SIZE;
      var octx = off.getContext("2d");
      var i = 0;
      var prevAuto = state.auto;
      state.auto = true;

      function step(){
        if(i < frames){
          draw(octx, i / fps * 1000);
          gif.addFrame(off, { delay: Math.round(1000 / fps), copy: true });
          setStatus("渲染帧 " + (i + 1) + "/" + frames);
          i++;
          setTimeout(step, 0);
        }else{
          gif.on("finished", function(blob){
            state.auto = prevAuto;
            download(blob, "arc.gif");
            setStatus("GIF 已保存：" + frames + " 帧 / " + fps + "fps", true);
            btn.disabled = false;
          });
          gif.on("progress", function(p){ setStatus("编码 GIF " + Math.round(p * 100) + "%"); });
          gif.render();
        }
      }
      step();
    }).catch(function(err){
      setStatus(err.message);
      btn.disabled = false;
    });
  });

  /* ---------- WebM 录制（原生，离线可用） ---------- */
  document.getElementById("btn-webm").addEventListener("click", function(){
    var btn = this;
    if(!canvas.captureStream || typeof MediaRecorder === "undefined"){
      setStatus("当前浏览器不支持 MediaRecorder，请用 Chrome/Edge");
      return;
    }
    btn.disabled = true;
    var prevAuto = state.auto;
    state.auto = true;
    var cycle = DURATION * 2;

    var stream = canvas.captureStream(30);
    var rec = new MediaRecorder(stream, { mimeType: "video/webm" });
    var chunks = [];
    rec.ondataavailable = function(e){ if(e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      state.auto = prevAuto;
      download(new Blob(chunks, { type: "video/webm" }), "arc.webm");
      setStatus("WebM 已保存（一个来回 " + cycle + " ms）", true);
      btn.disabled = false;
    };
    setStatus("录制中，约 " + Math.round(cycle / 1000) + " 秒…");
    rec.start();
    setTimeout(function(){ rec.stop(); }, cycle);
  });

  fitCanvas();
  renderCode();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
