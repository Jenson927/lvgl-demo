<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVGL Line 复刻与导出</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 22L10 8l6 12 5-8 8 6' fill='none' stroke='%232b7de9' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/panel.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">← 返回画廊</a>
    <h1>LVGL Line 本地复刻</h1>
    <p>四种预设几何（波浪 / 心形 / 折线 / 箭头）按点数采样，线宽、颜色、圆头、y 反转、节点与相位实时可调；下方 C 面板会同步生成 <code>lv_point_precise_t points[]</code> 数组。</p>
  </header>

  <div class="stage">
    <div class="stage-canvas-box"><canvas id="view"></canvas></div>
  </div>

  <section class="panel">
    <h2>参数（对应 LVGL 接口）</h2>
    <div class="grid">
      <div class="field wide">
        <label>预设几何</label>
        <div class="seg" id="preset">
          <button type="button" data-val="wave" class="active">波浪</button>
          <button type="button" data-val="heart">心形</button>
          <button type="button" data-val="polyline">折线</button>
          <button type="button" data-val="arrow">箭头</button>
        </div>
      </div>

      <div class="field">
        <label>点数 set_points <output id="o-points">8</output></label>
        <input type="range" id="points" min="4" max="12" step="1" value="8">
      </div>
      <div class="field">
        <label>线宽 line_width <output id="o-width">3 px</output></label>
        <input type="range" id="width" min="1" max="8" step="1" value="3">
      </div>

      <div class="field">
        <label>线条颜色 line_color</label>
        <input type="color" id="color" value="#2b7de9">
      </div>
      <div class="field">
        <label>相位 phase <output id="o-phase">0°</output></label>
        <input type="range" id="phase" min="0" max="360" step="1" value="0">
      </div>

      <div class="field">
        <label>圆头 / 圆角 line_rounded</label>
        <div class="check"><input type="checkbox" id="round" checked><span>round line cap / join</span></div>
      </div>
      <div class="field">
        <label>Y 反转 set_y_invert</label>
        <div class="check"><input type="checkbox" id="yinvert"><span>y = 0 移到对象底部</span></div>
      </div>

      <div class="field">
        <label>显示节点</label>
        <div class="check"><input type="checkbox" id="nodes"><span>仅预览，LVGL line 本身不画节点</span></div>
      </div>
      <div class="field">
        <label>相位动画</label>
        <div class="check"><input type="checkbox" id="anim" checked><span>90°/s 自动推进</span></div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="btn-gif">导出 GIF（相位动画）</button>
      <button type="button" class="btn" id="btn-webm">录制 WebM</button>
      <button type="button" class="btn" id="btn-png">导出 PNG</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <pre class="code" id="code"></pre>

  <footer>画布尺寸 320×240。GIF 编码由 gif.js（jsDelivr CDN）完成，需联网；WebM 使用浏览器原生 MediaRecorder，离线可用。</footer>
</div>

<script src="../assets/widget-kit.js"></script>
<script>
(function () {
  "use strict";
  var K = LVKit, W = 320, H = 240;
  var PRESET_NAME = { wave: "波浪", heart: "心形", polyline: "折线", arrow: "箭头" };

  var state = {
    preset: "wave",
    n: 8,
    width: 3,
    color: "#2b7de9",
    round: true,
    yinvert: false,
    nodes: false,
    phase: 0,
    anim: true
  };

  var view = K.view(document.getElementById("view"));
  view.resize(W, H);
  var t0 = performance.now();

  function shapePoints(preset, n, phaseDeg) {
    var pts = [], i, u, a;
    if (preset === "wave") {
      for (i = 0; i < n; i++) {
        u = i / (n - 1);
        pts.push({ x: u * 2 - 1, y: Math.sin(K.rad(phaseDeg) + u * Math.PI * 2.5) * 0.82 });
      }
    } else if (preset === "heart") {
      a = K.rad(phaseDeg);
      for (i = 0; i < n; i++) {
        var t = i / (n - 1) * Math.PI * 2;
        var hx = 16 * Math.pow(Math.sin(t), 3);
        var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        pts.push({
          x: (hx * Math.cos(a) - hy * Math.sin(a)) / 17,
          y: (hx * Math.sin(a) + hy * Math.cos(a)) / 17
        });
      }
    } else if (preset === "polyline") {
      for (i = 0; i < n; i++) {
        u = i / (n - 1);
        pts.push({
          x: u * 2 - 1,
          y: (i % 2 === 0 ? -0.72 : 0.72) * (0.78 + 0.22 * Math.sin(i * 1.9)) +
             0.1 * Math.sin(K.rad(phaseDeg) + u * Math.PI * 3)
        });
      }
    } else {
      var base = [
        { x: -1, y: 0.55 }, { x: 0.1, y: 0.55 }, { x: 0.1, y: 0.95 },
        { x: 1, y: 0 }, { x: 0.1, y: -0.95 }, { x: 0.1, y: -0.55 }, { x: -1, y: -0.55 }
      ];
      if (n <= base.length) {
        /* 低点数时保留箭尖 (3) 与两端，避免箭头被采样抹平 */
        var keep = [0, 3, 6, 1, 2, 4, 5].slice(0, n).sort(function (x, y) { return x - y; });
        for (i = 0; i < keep.length; i++) pts.push({ x: base[keep[i]].x, y: base[keep[i]].y });
      } else {
        pts = base.slice();
        while (pts.length < n) {
          var idx = 0, best = -1;
          for (i = 0; i < pts.length - 1; i++) {
            var ddx = pts[i + 1].x - pts[i].x;
            var ddy = pts[i + 1].y - pts[i].y;
            var dd = ddx * ddx + ddy * ddy;
            if (dd > best) { best = dd; idx = i; }
          }
          pts.splice(idx + 1, 0, {
            x: (pts[idx].x + pts[idx + 1].x) / 2,
            y: (pts[idx].y + pts[idx + 1].y) / 2
          });
        }
      }
      for (i = 0; i < pts.length; i++) {
        u = i / (pts.length - 1);
        pts[i].y += 0.08 * Math.sin(K.rad(phaseDeg) + u * Math.PI * 2);
      }
    }
    return pts;
  }

  function layoutPoints(norm) {
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    var arr = [], i;
    for (i = 0; i < norm.length; i++) {
      var p = { x: norm[i].x, y: state.yinvert ? -norm[i].y : norm[i].y };
      arr.push(p);
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
    var bw = Math.max(maxX - minX, 0.001);
    var bh = Math.max(maxY - minY, 0.001);
    var s = Math.min(260 / bw, 178 / bh);
    var cx = W / 2 - (minX + maxX) / 2 * s;
    var cy = H / 2 - (minY + maxY) / 2 * s;
    var out = [];
    for (i = 0; i < arr.length; i++) {
      out.push({ x: cx + arr[i].x * s, y: cy + arr[i].y * s });
    }
    return out;
  }

  function buildPts(t, forceAnim) {
    var ph = state.phase;
    if (forceAnim || state.anim) ph += t * 0.09;
    ph = ((ph % 360) + 360) % 360;
    return layoutPoints(shapePoints(state.preset, state.n, ph));
  }

  function drawPath(c, pts) {
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  }

  function drawScene(c, t, forceAnim) {
    c.clearRect(0, 0, W, H);
    var pts = buildPts(t, forceAnim);

    c.save();
    c.lineCap = state.round ? "round" : "butt";
    c.lineJoin = state.round ? "round" : "miter";

    /* 轻微投影，增加层次 */
    c.strokeStyle = "rgba(28,33,40,0.08)";
    c.lineWidth = state.width;
    c.save();
    c.translate(0, 1.5);
    drawPath(c, pts);
    c.stroke();
    c.restore();

    c.strokeStyle = state.color;
    c.lineWidth = state.width;
    drawPath(c, pts);
    c.stroke();

    if (state.nodes) {
      var r = Math.max(3, state.width * 0.65 + 1.6);
      for (var i = 0; i < pts.length; i++) {
        c.beginPath();
        c.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
        c.fillStyle = "#ffffff";
        c.fill();
        c.lineWidth = 1.5;
        c.strokeStyle = state.color;
        c.stroke();
      }
    }
    c.restore();

    K.text(c, PRESET_NAME[state.preset] + " · " + state.n + " 点", 12, 228, {
      size: 11, color: K.theme.textFaint
    });
    K.text(c, (forceAnim || state.anim) ? "相位动画播放中" : "相位 " + Math.round(state.phase) + "°",
      W - 12, 228, { size: 11, color: K.theme.textFaint, align: "right" });
  }

  K.run(function () {
    drawScene(view.ctx, performance.now() - t0, false);
  });

  function renderCode() {
    var pts = layoutPoints(shapePoints(state.preset, state.n, state.phase));
    var L = [];
    L.push(K.cm("/* 由页面参数实时生成 · 坐标以 line 对象左上角为原点 */"));
    L.push("static lv_point_precise_t points[] = {");
    for (var i = 0; i < pts.length; i++) {
      L.push("    {" + K.num(Math.round(pts[i].x)) + ", " + K.num(Math.round(pts[i].y)) + "},");
    }
    L.push("};");
    L.push("");
    L.push("lv_obj_t * line = " + K.fn("lv_line_create") + "(lv_screen_active());");
    L.push(K.fn("lv_obj_set_size") + "(line, " + K.num(W) + ", " + K.num(H) + ");");
    L.push(K.fn("lv_obj_center") + "(line);");
    L.push(K.fn("lv_line_set_points") + "(line, points, " + K.num(pts.length) + ");");
    L.push(K.fn("lv_line_set_y_invert") + "(line, " + (state.yinvert ? "true" : "false") + ");");
    L.push("");
    L.push(K.fn("lv_obj_set_style_line_width") + "(line, " + K.num(state.width) + ", LV_PART_MAIN);");
    L.push(K.fn("lv_obj_set_style_line_color") + "(line, " + K.fn("lv_color_hex") + "(" + K.num(K.hexCode(state.color)) + "), LV_PART_MAIN);");
    L.push(K.fn("lv_obj_set_style_line_rounded") + "(line, " + (state.round ? "true" : "false") + ", LV_PART_MAIN);");
    if (state.anim) {
      L.push("");
      L.push(K.cm("/* 相位动画：约每 30 ms 重算 points[] 并再次调用 lv_line_set_points() 即可 */"));
    }
    if (state.nodes) {
      L.push(K.cm("/* 预览中的节点圆点仅用于示意，LVGL 的 line 只绘制折线 */"));
    }
    K.code(L);
  }

  K.bindSeg("preset", function (v) {
    state.preset = v;
    renderCode();
  });
  K.bindRange("points", function (v) { return v; }, function (v) { state.n = v; renderCode(); });
  K.bindRange("width", function (v) { return v + " px"; }, function (v) { state.width = v; renderCode(); });
  K.bindRange("phase", function (v) { return v + "°"; }, function (v) { state.phase = v; renderCode(); });
  document.getElementById("color").addEventListener("input", function (e) {
    state.color = e.target.value;
    renderCode();
  });
  K.bindCheck("round", function (v) { state.round = v; renderCode(); });
  K.bindCheck("yinvert", function (v) { state.yinvert = v; renderCode(); });
  K.bindCheck("nodes", function (v) { state.nodes = v; renderCode(); });
  K.bindCheck("anim", function (v) { state.anim = v; renderCode(); });

  document.getElementById("btn-png").addEventListener("click", function () {
    K.exportPng(view.canvas, "line.png");
  });

  document.getElementById("btn-gif").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    K.exportGif({
      name: "line.gif", w: W, h: H, fps: 20, duration: 4000,
      frame: function (c, t) {
        drawScene(c, t, true);
      },
      onDone: function () { btn.disabled = false; },
      onError: function () { btn.disabled = false; }
    });
  });

  document.getElementById("btn-webm").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    K.exportWebm({
      canvas: view.canvas, name: "line.webm", duration: 4000,
      before: function () {
        var old = state.anim;
        state.anim = true;
        return old;
      },
      after: function (old) { state.anim = old; },
      onDone: function () { btn.disabled = false; },
      onError: function () { btn.disabled = false; }
    });
  });

  renderCode();
})();
</script>
</body>
</html>
