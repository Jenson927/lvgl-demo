<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVGL Table 复刻与导出</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='7' width='22' height='18' rx='3' fill='none' stroke='%232b7de9' stroke-width='2'/%3E%3Cpath d='M5 13h22M5 19h22M14 7v18M22 7v18' stroke='%232b7de9' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/panel.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">← 返回画廊</a>
    <h1>LVGL Table 本地复刻</h1>
    <p>表头 + 数据行、点击选中、列宽模式与合并单元格实时可调，参数对齐 <code>lv_table_set_row_count()</code> / <code>lv_table_set_cell_value()</code> / <code>lv_table_set_selected_cell()</code>。</p>
  </header>

  <div class="stage">
    <div class="stage-canvas-box"><canvas id="view"></canvas></div>
  </div>

  <section class="panel">
    <h2>参数（对应 LVGL 接口）</h2>
    <div class="grid">
      <div class="field wide">
        <label>选中单元格 <output id="o-sel">第 2 行 / 第 2 列</output></label>
        <input type="text" id="cell-text" maxlength="18" value="12">
      </div>

      <div class="field">
        <label>行数 row_count <output id="o-rows">5 行</output></label>
        <input type="range" id="rows" min="2" max="8" step="1" value="5">
      </div>
      <div class="field">
        <label>列数 column_count <output id="o-cols">4 列</output></label>
        <input type="range" id="cols" min="2" max="6" step="1" value="4">
      </div>

      <div class="field wide">
        <label>列宽模式 set_column_width</label>
        <div class="seg" id="wmode">
          <button type="button" data-val="auto" class="active">auto 自适应</button>
          <button type="button" data-val="40">40 px</button>
          <button type="button" data-val="60">60 px</button>
          <button type="button" data-val="80">80 px</button>
        </div>
      </div>

      <div class="field">
        <label>表头高亮</label>
        <div class="check"><input type="checkbox" id="header" checked><span>第 0 行浅灰底 + 加粗</span></div>
      </div>
      <div class="field">
        <label>合并单元格 MERGE_RIGHT</label>
        <div class="check"><input type="checkbox" id="merge"><span>表头最后两列合并</span></div>
      </div>

      <div class="field wide">
        <label>提示</label>
        <div class="check"><span style="font-size:12px">点击画布任意单元格即可选中；选中后可在上方输入框改内容再点“应用文本”。</span></div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="btn-apply">应用文本</button>
      <button type="button" class="btn primary" id="btn-png">导出 PNG</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <pre class="code" id="code"></pre>

  <footer>画布尺寸 320×240 · 静态页仅提供 PNG 导出 · GIF 编码需联网，WebM 使用浏览器原生录制、离线可用。</footer>
</div>

<script src="../assets/widget-kit.js"></script>
<script>(function () {
  "use strict";
  var K = LVKit, W = 320, H = 240;
  var M = 12, ROW_H = 28, PAD = 6;

  var HEADERS = ["名称", "数量", "单价", "状态", "备注", "标签"];
  var DATA = [
    HEADERS,
    ["键盘", "12", "199", "在售", "USB-C", "热销"],
    ["鼠标", "34", "89", "在售", "无线", "新品"],
    ["显示器", "7", "1299", "缺货", "27 寸", ""],
    ["耳机", "21", "349", "在售", "降噪", "热销"],
    ["音箱", "9", "499", "在售", "蓝牙", ""],
    ["摄像头", "15", "259", "缺货", "1080P", ""],
    ["支架", "40", "59", "在售", "铝合金", ""]
  ];

  var state = {
    rows: 5, cols: 4,
    widthMode: "auto",
    header: true, merge: false,
    selRow: 1, selCol: 1,
    cells: {}
  };

  var view = K.view(document.getElementById("view"));
  view.resize(W, H);
  view.canvas.style.cursor = "pointer";

  function defaultText(r, c) {
    if (r === 0) return HEADERS[c] || "";
    var row = DATA[r];
    return row ? (row[c] || "") : "";
  }

  function cellText(r, c) {
    var key = r + "," + c;
    if (Object.prototype.hasOwnProperty.call(state.cells, key)) return state.cells[key];
    return defaultText(r, c);
  }

  function mergeEnabled() { return state.merge && state.cols >= 3; }
  function isHidden(r, c) { return mergeEnabled() && r === 0 && c === state.cols - 1; }
  function spanOf(r, c) { return (mergeEnabled() && r === 0 && c === state.cols - 2) ? 2 : 1; }

  function layoutTable() {
    var ws = [], total = 0, i;
    if (state.widthMode === "auto") {
      var base = Math.floor((W - 2 * M) / state.cols);
      for (i = 0; i < state.cols; i++) ws.push(base);
      ws[state.cols - 1] += (W - 2 * M) - base * state.cols;
    } else {
      var fw = Number(state.widthMode);
      for (i = 0; i < state.cols; i++) ws.push(fw);
    }
    for (i = 0; i < ws.length; i++) total += ws[i];
    return { ws: ws, total: total };
  }

  function cellRect(lt, r, c) {
    var x = M, i;
    for (i = 0; i < c; i++) x += lt.ws[i] || 0;
    var w = 0;
    for (i = 0; i < spanOf(r, c); i++) w += lt.ws[c + i] || 0;
    return { x: x, y: M + r * ROW_H, w: w, h: ROW_H };
  }

  function fitText(c, s, maxW, o) {
    s = String(s);
    if (K.measure(c, s, o) <= maxW) return s;
    var out = s;
    while (out.length && K.measure(c, out + "…", o) > maxW) out = out.slice(0, -1);
    return out + "…";
  }

  function draw(c) {
    c.clearRect(0, 0, W, H);

    var lt = layoutTable();
    var cardW = Math.min(lt.total, W - M);
    var cardH = state.rows * ROW_H;

    K.box(c, M, M, cardW, cardH, {
      bg: "#ffffff", radius: 4,
      shadow: K.alpha("#1c2128", 0.10), shadowBlur: 10, shadowY: 3
    });

    c.save();
    K.roundRectPath(c, M, M, cardW, cardH, 4);
    c.clip();

    var r, col, x, y;
    for (r = 0; r < state.rows; r++) {
      for (col = 0; col < state.cols; col++) {
        if (isHidden(r, col)) continue;
        var rect = cellRect(lt, r, col);
        var isHeader = (r === 0 && state.header);
        var isSel = (r === state.selRow && col === state.selCol);

        if (isHeader) {
          c.fillStyle = "#f2f4f7";
          c.fillRect(rect.x, rect.y, rect.w, rect.h);
        }
        if (isSel) {
          c.fillStyle = "#eef5ff";
          c.fillRect(rect.x, rect.y, rect.w, rect.h);
        }

        var label = fitText(c, cellText(r, col), rect.w - PAD * 2, { size: 12.5 });
        K.text(c, label, rect.x + PAD, rect.y + rect.h / 2 + 1, {
          size: 12.5,
          weight: isHeader && state.header ? 600 : 400,
          color: isHeader && state.header ? "#3a4350" : K.theme.text
        });
      }
    }

    c.strokeStyle = "#d6d9df";
    c.lineWidth = 1;
    x = M;
    for (col = 0; col <= state.cols; col++) {
      c.beginPath();
      c.moveTo(Math.round(x) + 0.5, M);
      c.lineTo(Math.round(x) + 0.5, M + cardH);
      c.stroke();
      x += lt.ws[col] || 0;
    }
    y = M;
    for (r = 0; r <= state.rows; r++) {
      c.beginPath();
      c.moveTo(M, Math.round(y) + 0.5);
      c.lineTo(M + cardW, Math.round(y) + 0.5);
      c.stroke();
      y += ROW_H;
    }

    var srect = cellRect(lt, state.selRow, state.selCol);
    if (srect.x < M + cardW && srect.y < M + cardH) {
      c.save();
      c.strokeStyle = K.theme.primary;
      c.lineWidth = 2;
      c.strokeRect(srect.x + 1, srect.y + 1, Math.min(srect.w, M + cardW - srect.x) - 2, srect.h - 2);
      c.restore();
    }

    c.restore();

    K.box(c, M, M, cardW, cardH, { radius: 4, borderWidth: 1, border: "#c9ced6" });

    if (M + lt.total > W) {
      var msg = "内容超出画布，已裁剪";
      var tw = K.measure(c, msg, { size: 11 });
      K.box(c, W - 10 - tw - 14, H - 30, tw + 14, 20, {
        bg: K.alpha("#ffffff", 0.95), radius: 10, borderWidth: 1, border: "#e6a23c"
      });
      K.text(c, msg, W - 17, H - 19.5, { size: 11, color: "#c98a20", align: "right" });
    }
  }

  K.run(function () { draw(view.ctx); });

  function clampSelection() {
    state.selRow = K.clamp(state.selRow, 0, state.rows - 1);
    state.selCol = K.clamp(state.selCol, 0, state.cols - 1);
    if (isHidden(state.selRow, state.selCol)) state.selCol = state.cols - 2;
  }

  function syncSelectionUI() {
    document.getElementById("o-sel").textContent = "第 " + (state.selRow + 1) + " 行 / 第 " + (state.selCol + 1) + " 列";
    document.getElementById("cell-text").value = cellText(state.selRow, state.selCol);
  }

  function updateStatus(msg) {
    if (msg) { K.status(msg); return; }
    var lt = layoutTable();
    if (M + lt.total > W) {
      K.status("表格宽 " + lt.total + "px，超出 320px 画布，已裁剪");
    } else {
      K.status("选中 第 " + (state.selRow + 1) + " 行 / 第 " + (state.selCol + 1) + " 列 · “" + cellText(state.selRow, state.selCol) + "”");
    }
  }

  function hitTest(px, py) {
    if (px < M || py < M) return null;
    var r = Math.floor((py - M) / ROW_H);
    if (r < 0 || r >= state.rows) return null;
    var lt = layoutTable();
    var x = M, col;
    for (col = 0; col < state.cols; col++) {
      var w = lt.ws[col] || 0;
      if (px >= x && px < x + w) {
        if (isHidden(r, col)) col = state.cols - 2;
        return { row: r, col: col };
      }
      x += w;
    }
    return null;
  }

  view.canvas.addEventListener("pointerdown", function (e) {
    var rect = view.canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (W / rect.width);
    var py = (e.clientY - rect.top) * (H / rect.height);
    var hit = hitTest(px, py);
    if (!hit) return;
    state.selRow = hit.row;
    state.selCol = hit.col;
    syncSelectionUI();
    renderCode();
    updateStatus();
  });

  document.getElementById("btn-apply").addEventListener("click", function () {
    var val = document.getElementById("cell-text").value;
    state.cells[state.selRow + "," + state.selCol] = val;
    renderCode();
    updateStatus("已写入单元格 (" + state.selRow + ", " + state.selCol + ")：" + val);
  });

  K.bindRange("rows", function (v) { return v + " 行"; }, function (v) {
    state.rows = v;
    clampSelection();
    syncSelectionUI();
    renderCode();
    updateStatus();
  });
  K.bindRange("cols", function (v) { return v + " 列"; }, function (v) {
    state.cols = v;
    clampSelection();
    syncSelectionUI();
    renderCode();
    updateStatus();
  });

  K.bindSeg("wmode", function (v) {
    state.widthMode = v;
    renderCode();
    updateStatus();
  });
  K.bindCheck("header", function (on) {
    state.header = on;
    renderCode();
  });
  K.bindCheck("merge", function (on) {
    state.merge = on;
    clampSelection();
    syncSelectionUI();
    renderCode();
    updateStatus();
  });

  function cstr(s) {
    return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n") + '"';
  }

  function renderCode() {
    var L = [];
    L.push(K.cm("/* 由页面参数实时生成 */"));
    L.push("lv_obj_t * table = " + K.fn("lv_table_create") + "(lv_screen_active());");
    L.push(K.fn("lv_obj_set_size") + "(table, " + K.num("LV_SIZE_CONTENT") + ", " + K.num("LV_SIZE_CONTENT") + ");");
    L.push(K.fn("lv_table_set_row_count") + "(table, " + K.num(state.rows) + ");");
    L.push(K.fn("lv_table_set_column_count") + "(table, " + K.num(state.cols) + ");");

    if (state.widthMode === "auto") {
      L.push(K.cm("/* 列宽 auto：不调用 set_column_width，由内容自适应 */"));
    } else {
      L.push(K.fn("lv_table_set_column_width") + "(table, " + K.num(0) + ", " + K.num(Number(state.widthMode)) + ");");
      L.push(K.cm("/* 其余列同理：lv_table_set_column_width(table, col, " + state.widthMode + "); */"));
    }

    var r, col;
    for (r = 0; r < state.rows; r++) {
      for (col = 0; col < state.cols; col++) {
        if (isHidden(r, col)) continue;
        L.push(K.fn("lv_table_set_cell_value") + "(table, " + K.num(r) + ", " + K.num(col) + ", " + cstr(cellText(r, col)) + ");");
      }
    }

    if (mergeEnabled()) {
      L.push(K.fn("lv_table_set_cell_ctrl") + "(table, " + K.num(0) + ", " + K.num(state.cols - 2) + ", " + K.num("LV_TABLE_CELL_CTRL_MERGE_RIGHT") + ");");
    }

    L.push(K.fn("lv_table_set_selected_cell") + "(table, " + K.num(state.selRow) + ", " + K.num(state.selCol) + ");");

    L.push(K.cm("/* 表头浅灰底：可在 LV_EVENT_DRAW_TASK_ADDED 中单独绘制第 0 行 */"));
    L.push(K.fn("lv_obj_set_style_bg_color") + "(table, " + K.fn("lv_color_hex") + "(" + K.num(K.hexCode(state.header ? "#f2f4f7" : "#ffffff")) + "), LV_PART_ITEMS);");
    L.push(K.fn("lv_obj_set_style_border_width") + "(table, " + K.num(1) + ", LV_PART_ITEMS);");
    L.push(K.fn("lv_obj_set_style_border_color") + "(table, " + K.fn("lv_color_hex") + "(" + K.num("0xd6d9df") + "), LV_PART_ITEMS);");
    L.push(K.fn("lv_obj_set_style_bg_color") + "(table, " + K.fn("lv_color_hex") + "(" + K.num("0x2b7de9") + "), LV_PART_ITEMS | LV_STATE_PRESSED);");
    L.push(K.fn("lv_obj_center") + "(table);");

    K.code(L);
  }

  document.getElementById("btn-png").addEventListener("click", function () {
    K.exportPng(view.canvas, "table.png");
  });

  syncSelectionUI();
  renderCode();
  updateStatus();
})();</script>
</body>
</html>
