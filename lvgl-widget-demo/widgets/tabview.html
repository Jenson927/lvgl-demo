<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVGL Tabview 复刻与导出</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='20' rx='4' fill='%23ffffff' stroke='%232b7de9' stroke-width='2'/%3E%3Crect x='4' y='6' width='10' height='6' rx='3' fill='%232b7de9'/%3E%3Crect x='6' y='16' width='20' height='2.4' rx='1.2' fill='%23d6d9df'/%3E%3Crect x='6' y='20.5' width='13' height='2.4' rx='1.2' fill='%23d6d9df'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/panel.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">← 返回画廊</a>
    <h1>LVGL Tabview 本地复刻</h1>
    <p>标签栏可在上 / 下 / 左 / 右四个方向停靠，切换时内容横向或纵向滑动，参数对齐 <code>lv_tabview_set_tab_bar_position()</code> / <code>lv_tabview_set_tab_bar_size()</code> / <code>lv_tabview_set_active()</code>。</p>
  </header>

  <div class="stage">
    <div class="stage-canvas-box"><canvas id="view"></canvas></div>
  </div>

  <section class="panel">
    <h2>参数（对应 LVGL 接口）</h2>
    <div class="grid">
      <div class="field wide">
        <label>标签位置 set_tab_bar_position</label>
        <div class="seg" id="pos">
          <button type="button" data-val="top" class="active">上</button>
          <button type="button" data-val="bottom">下</button>
          <button type="button" data-val="left">左</button>
          <button type="button" data-val="right">右</button>
        </div>
      </div>
      <div class="field">
        <label>标签栏尺寸 <output id="o-size">40 px</output></label>
        <input type="range" id="size" min="24" max="80" step="2" value="40">
      </div>
      <div class="field">
        <label>标签数量 <output id="o-count">4</output></label>
        <input type="range" id="count" min="2" max="5" step="1" value="4">
      </div>
      <div class="field">
        <label>活动标签索引 <output id="o-active">0</output></label>
        <input type="range" id="active" min="0" max="3" step="1" value="0">
      </div>
      <div class="field">
        <label>动画时长 <output id="o-dur">320 ms</output></label>
        <input type="range" id="dur" min="0" max="600" step="20" value="320">
      </div>
      <div class="field wide">
        <label>自动切换演示</label>
        <div class="check"><input type="checkbox" id="auto"><span>依次切换所有标签页（导出动图用）</span></div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="btn-gif">导出 GIF</button>
      <button type="button" class="btn" id="btn-webm">录制 WebM</button>
      <button type="button" class="btn" id="btn-png">导出 PNG</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <pre class="code" id="code"></pre>

  <footer>画布尺寸 320×240。GIF 编码由 gif.js（jsDelivr CDN）完成，需联网；WebM 使用浏览器原生 MediaRecorder，离线可用。点击标签栏可切换页面。</footer>
</div>

<script src="../assets/widget-kit.js"></script>
<script>
(function () {
  "use strict";
  var K = LVKit, W = 320, H = 240;

  var TABS = ["首页", "设置", "消息", "相册", "更多"];
  var TAB_ICONS = ["home", "gear", "bell", "folder", "play"];
  var ACCENTS = ["#2b7de9", "#1f9d66", "#e6a23c", "#8e63d6", "#e04b4b"];
  var DIR_CONST = {
    top: "LV_DIR_TOP", bottom: "LV_DIR_BOTTOM",
    left: "LV_DIR_LEFT", right: "LV_DIR_RIGHT"
  };

  var state = {
    pos: "top",
    size: 40,
    count: 4,
    active: 0,
    dur: 320,
    auto: false
  };

  var view = K.view(document.getElementById("view"));
  view.resize(W, H);

  var t0 = performance.now();
  var autoStart = 0;
  var anim = { from: 0, to: 0, start: 0 };
  var tabRects = [];

  var HOLD = 1300;

  function autoState(t) {
    var period = HOLD + state.dur;
    var seg = Math.floor(t / period);
    var local = t - seg * period;
    var from = seg % state.count;
    var to = (seg + 1) % state.count;
    var p = state.dur > 0 ? K.clamp((local - HOLD) / state.dur, 0, 1) : 1;
    return { from: from, to: to, p: p };
  }

  function layout() {
    var cx = 8, cy = 8, cw = 304, ch = 224;
    var size = state.size;
    var horizontal = (state.pos === "top" || state.pos === "bottom");
    var barX, barY, barW, barH;
    var contentX, contentY, contentW, contentH;

    if (state.pos === "top") {
      barX = cx; barY = cy; barW = cw; barH = size;
      contentX = cx; contentY = cy + size; contentW = cw; contentH = ch - size;
    } else if (state.pos === "bottom") {
      barX = cx; barY = cy + ch - size; barW = cw; barH = size;
      contentX = cx; contentY = cy; contentW = cw; contentH = ch - size;
    } else if (state.pos === "left") {
      barX = cx; barY = cy; barW = size; barH = ch;
      contentX = cx + size; contentY = cy; contentW = cw - size; contentH = ch;
    } else {
      barX = cx + cw - size; barY = cy; barW = size; barH = ch;
      contentX = cx; contentY = cy; contentW = cw - size; contentH = ch;
    }

    return {
      cx: cx, cy: cy, cw: cw, ch: ch,
      barX: barX, barY: barY, barW: barW, barH: barH,
      contentX: contentX, contentY: contentY, contentW: contentW, contentH: contentH,
      horizontal: horizontal
    };
  }

  /* ---------- 页面内容 ---------- */
  function drawPage(c, idx, x, y, w, h) {
    var ac = ACCENTS[idx % ACCENTS.length];
    c.save();
    c.beginPath();
    c.rect(x, y, w, h);
    c.clip();

    c.fillStyle = "#ffffff";
    c.fillRect(x, y, w, h);

    K.text(c, TABS[idx] + "页面", x + 18, y + 20, { size: 14, weight: 600, color: K.theme.text });

    var cardX = x + 14;
    var cardY = y + 38;
    var cardW = w - 28;
    var cardH = Math.max(40, h - 48);
    K.box(c, cardX, cardY, cardW, cardH, {
      bg: "#f7f9fc", radius: 10, borderWidth: 1, border: "#e8ecf2"
    });

    var ccx = cardX + cardW / 2;
    var icy = cardY + Math.min(36, cardH * 0.36);

    c.beginPath();
    c.arc(ccx, icy, 18, 0, Math.PI * 2);
    c.fillStyle = K.alpha(ac, 0.13);
    c.fill();
    K.icon(c, TAB_ICONS[idx % TAB_ICONS.length], ccx - 9, icy - 9, 18, ac);

    if (cardH > 58) {
      K.text(c, TABS[idx], ccx, icy + 31, { size: 14.5, weight: 600, color: K.theme.text, align: "center" });
    }
    if (cardH > 82) {
      K.text(c, "第 " + (idx + 1) + " / " + state.count + " 个标签页", ccx, icy + 49, {
        size: 11, color: K.theme.textMuted, align: "center"
      });
    }
    if (cardH > 140) {
      for (var i = 0; i < 3; i++) {
        var bw = (cardW - 48) * (i === 2 ? 0.5 : 0.8);
        K.box(c, cardX + 24, icy + 68 + i * 11, bw, 6, {
          bg: i === 0 ? K.alpha(ac, 0.35) : "#e6eaf1", radius: 3
        });
      }
    }

    c.restore();
  }

  /* ---------- 标签栏 ---------- */
  function drawBar(c, L, active) {
    tabRects = [];
    c.fillStyle = "#f5f7fa";
    c.fillRect(L.barX, L.barY, L.barW, L.barH);

    var i, cellW, cellH, tx, ty, isActive;

    for (i = 0; i < state.count; i++) {
      isActive = (i === active);
      if (L.horizontal) {
        cellW = L.barW / state.count;
        tx = L.barX + i * cellW;
        ty = L.barY;
        if (isActive) {
          c.fillStyle = "#ffffff";
          c.fillRect(tx, ty, cellW, L.barH);
          c.fillStyle = K.theme.primary;
          if (state.pos === "top") c.fillRect(tx + 4, ty + L.barH - 3, cellW - 8, 3);
          else c.fillRect(tx + 4, ty, cellW - 8, 3);
        }
        K.text(c, TABS[i], tx + cellW / 2, ty + L.barH / 2 + 0.5, {
          size: K.clamp(state.size * 0.32, 10, 14),
          weight: isActive ? 600 : 400,
          color: isActive ? K.theme.primary : K.theme.textMuted,
          align: "center"
        });
        tabRects.push({ idx: i, x: tx, y: ty, w: cellW, h: L.barH });
      } else {
        cellH = L.barH / state.count;
        tx = L.barX;
        ty = L.barY + i * cellH;
        if (isActive) {
          c.fillStyle = "#ffffff";
          c.fillRect(tx, ty, L.barW, cellH);
          c.fillStyle = K.theme.primary;
          if (state.pos === "left") c.fillRect(tx + L.barW - 3, ty + 4, 3, cellH - 8);
          else c.fillRect(tx, ty + 4, 3, cellH - 8);
        }
        K.text(c, TABS[i], tx + L.barW / 2, ty + cellH / 2 + 0.5, {
          size: K.clamp(state.size * 0.26, 9, 12),
          weight: isActive ? 600 : 400,
          color: isActive ? K.theme.primary : K.theme.textMuted,
          align: "center"
        });
        tabRects.push({ idx: i, x: tx, y: ty, w: L.barW, h: cellH });
      }
    }
  }

  /* ---------- 场景 ---------- */
  function drawScene(c, t, forceAuto) {
    var autoOn = forceAuto || state.auto;
    var from = anim.from, to = anim.to, p = 1;

    if (autoOn) {
      var a = autoState(t);
      from = a.from;
      to = a.to;
      p = a.p;
    } else {
      p = state.dur > 0 ? K.clamp((performance.now() - anim.start) / state.dur, 0, 1) : 1;
    }

    var e = K.ease(p);
    var active = (p <= 0) ? from : to;
    var L = layout();

    c.clearRect(0, 0, W, H);
    c.fillStyle = "#ffffff";
    c.fillRect(0, 0, W, H);

    K.box(c, L.cx, L.cy, L.cw, L.ch, {
      bg: "#ffffff", radius: 14,
      shadow: K.alpha("#1c2128", 0.09), shadowBlur: 16, shadowY: 4
    });

    c.save();
    K.roundRectPath(c, L.cx, L.cy, L.cw, L.ch, 14);
    c.clip();

    c.save();
    c.beginPath();
    c.rect(L.contentX, L.contentY, L.contentW, L.contentH);
    c.clip();

    if (L.horizontal) {
      drawPage(c, from, L.contentX - e * L.contentW, L.contentY, L.contentW, L.contentH);
      drawPage(c, to, L.contentX + (1 - e) * L.contentW, L.contentY, L.contentW, L.contentH);
    } else {
      drawPage(c, from, L.contentX, L.contentY - e * L.contentH, L.contentW, L.contentH);
      drawPage(c, to, L.contentX, L.contentY + (1 - e) * L.contentH, L.contentW, L.contentH);
    }
    c.restore();

    drawBar(c, L, active);

    c.fillStyle = "#e6e9ee";
    if (state.pos === "top") c.fillRect(L.cx, L.contentY - 1, L.cw, 1);
    else if (state.pos === "bottom") c.fillRect(L.cx, L.barY, L.cw, 1);
    else if (state.pos === "left") c.fillRect(L.contentX - 1, L.cy, 1, L.ch);
    else c.fillRect(L.barX, L.cy, 1, L.ch);

    c.restore();

    K.box(c, L.cx, L.cy, L.cw, L.ch, {
      radius: 14, borderWidth: 1, border: K.theme.border
    });
  }

  K.run(function (now) {
    var t = state.auto ? now - autoStart : now - t0;
    drawScene(view.ctx, t, false);
    if (state.auto) {
      var a = autoState(t);
      var act = (a.p <= 0) ? a.from : a.to;
      if (state.active !== act) {
        state.active = act;
        syncActiveUI();
        renderCode();
      }
    }
  });

  /* ---------- 交互 ---------- */
  function posOf(e) {
    var r = view.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function stopAuto() {
    if (state.auto) {
      state.auto = false;
      document.getElementById("auto").checked = false;
    }
  }

  view.canvas.addEventListener("pointerdown", function (e) {
    var p = posOf(e);
    for (var i = 0; i < tabRects.length; i++) {
      var t = tabRects[i];
      if (p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h) {
        stopAuto();
        if (i !== state.active) {
          anim.from = state.active;
          anim.to = t.idx;
          anim.start = performance.now();
          state.active = t.idx;
          syncActiveUI();
          renderCode();
        }
        return;
      }
    }
  });

  /* ---------- 参数 ---------- */
  function syncActiveUI() {
    var el = document.getElementById("active");
    el.max = state.count - 1;
    if (state.active > state.count - 1) state.active = state.count - 1;
    el.value = state.active;
    document.getElementById("o-active").textContent = state.active;
    document.getElementById("o-count").textContent = state.count;
    document.getElementById("count").value = state.count;
  }

  K.bindSeg("pos", function (v) {
    state.pos = v;
    renderCode();
  });

  K.bindRange("size", function (v) { return v + " px"; }, function (v) {
    state.size = v;
    renderCode();
  });

  K.bindRange("count", null, function (v) {
    state.count = v;
    syncActiveUI();
    anim.from = state.active;
    anim.to = state.active;
    anim.start = 0;
    renderCode();
  });

  K.bindRange("active", null, function (v) {
    state.active = v;
    anim.from = v;
    anim.to = v;
    anim.start = 0;
    renderCode();
  });

  K.bindRange("dur", function (v) { return v + " ms"; }, function (v) {
    state.dur = v;
    renderCode();
  });

  K.bindCheck("auto", function (on) {
    state.auto = on;
    autoStart = performance.now();
    if (on) {
      state.active = 0;
      anim.from = 0;
      anim.to = 0;
      anim.start = 0;
      syncActiveUI();
      renderCode();
    } else {
      anim.from = state.active;
      anim.to = state.active;
      anim.start = 0;
    }
  });

  /* ---------- C 代码 ---------- */
  function renderCode() {
    var L = [];
    L.push(K.cm("/* 由页面参数实时生成 */"));
    L.push("lv_obj_t * tv = " + K.fn("lv_tabview_create") + "(lv_screen_active());");
    L.push(K.fn("lv_obj_set_size") + "(tv, " + K.num(304) + ", " + K.num(224) + ");");
    L.push(K.fn("lv_obj_center") + "(tv);");
    L.push("");
    for (var i = 0; i < state.count; i++) {
      L.push("lv_obj_t * tab_" + i + " = " + K.fn("lv_tabview_add_tab") + "(tv, " + JSON.stringify(TABS[i]) + ");");
    }
    L.push("lv_obj_t * content = " + K.fn("lv_tabview_get_content") + "(tv);" + K.cm("  /* 标签页内容容器 */"));
    L.push("");
    L.push(K.fn("lv_tabview_set_tab_bar_position") + "(tv, " + K.num(DIR_CONST[state.pos]) + ");");
    L.push(K.fn("lv_tabview_set_tab_bar_size") + "(tv, " + K.num(state.size) + ");");
    L.push(K.fn("lv_tabview_set_active") + "(tv, " + K.num(state.active) + ", " +
      K.num(state.dur > 0 ? "LV_ANIM_ON" : "LV_ANIM_OFF") + ");");
    L.push(K.fn("lv_obj_set_style_anim_duration") + "(tv, " + K.num(state.dur) + ", " + K.num(0) + ");");
    K.code(L);
  }

  /* ---------- 导出 ---------- */
  var FULL_CYCLE = function () { return state.count * (HOLD + state.dur); };

  document.getElementById("btn-png").addEventListener("click", function () {
    K.exportPng(view.canvas, "tabview.png");
  });

  document.getElementById("btn-gif").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    K.exportGif({
      name: "tabview.gif", w: W, h: H, fps: 14, duration: FULL_CYCLE(),
      frame: function (c, t) { drawScene(c, t, true); },
      onDone: function () { btn.disabled = false; },
      onError: function () { btn.disabled = false; }
    });
  });

  document.getElementById("btn-webm").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    K.exportWebm({
      canvas: view.canvas, name: "tabview.webm", duration: FULL_CYCLE(),
      before: function () {
        var old = state.auto;
        state.auto = true;
        autoStart = performance.now();
        document.getElementById("auto").checked = true;
        state.active = 0;
        syncActiveUI();
        return old;
      },
      after: function (old) {
        state.auto = old;
        document.getElementById("auto").checked = old;
      },
      onDone: function () { btn.disabled = false; },
      onError: function () { btn.disabled = false; }
    });
  });

  syncActiveUI();
  renderCode();
})();
</script>
</body>
</html>
