<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVGL Win 复刻与导出</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='20' rx='5' fill='%232b7de9'/%3E%3Crect x='4' y='6' width='24' height='7' rx='4' fill='%231f6fd0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/panel.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">← 返回画廊</a>
    <h1>LVGL Win 本地复刻</h1>
    <p>窗口标题栏、最小化 / 最大化 / 关闭按钮与内容区，参数对齐 <code>lv_win_add_title()</code> / <code>lv_win_add_button()</code>，可拖动标题栏移动窗口。</p>
  </header>

  <div class="stage">
    <div class="stage-canvas-box"><canvas id="view"></canvas></div>
  </div>

  <section class="panel">
    <h2>参数（对应 LVGL 接口）</h2>
    <div class="grid">
      <div class="field wide">
        <label>标题文本 lv_win_add_title</label>
        <input type="text" id="title" value="系统设置" maxlength="16">
      </div>
      <div class="field">
        <label>窗口宽度 <output id="o-w">280 px</output></label>
        <input type="range" id="w" min="220" max="310" step="2" value="280">
      </div>
      <div class="field">
        <label>窗口高度 <output id="o-h">190 px</output></label>
        <input type="range" id="h" min="140" max="220" step="2" value="190">
      </div>
      <div class="field">
        <label>内容条目数 <output id="o-rows">3</output></label>
        <input type="range" id="rows" min="1" max="5" step="1" value="3">
      </div>
      <div class="field">
        <label>自动最大化演示</label>
        <div class="check"><input type="checkbox" id="auto"><span>在普通 / 最大化之间往返</span></div>
      </div>
      <div class="field">
        <label>最小化按钮 LV_SYMBOL_MINUS</label>
        <div class="check"><input type="checkbox" id="show-min" checked><span>显示该按钮</span></div>
      </div>
      <div class="field">
        <label>最大化按钮 LV_SYMBOL_PLUS</label>
        <div class="check"><input type="checkbox" id="show-max" checked><span>显示该按钮</span></div>
      </div>
      <div class="field">
        <label>关闭按钮 LV_SYMBOL_CLOSE</label>
        <div class="check"><input type="checkbox" id="show-close" checked><span>显示该按钮</span></div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="btn-png">导出 PNG</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <pre class="code" id="code"></pre>

  <footer>画布尺寸 320×240。GIF 编码由 gif.js（jsDelivr CDN）完成，需联网；WebM 使用浏览器原生 MediaRecorder，离线可用。本页为静态演示，仅导出 PNG。</footer>
</div>

<script src="../assets/widget-kit.js"></script>
<script>
(function () {
  "use strict";
  var K = LVKit, W = 320, H = 240, HEADER = 34;
  var ROW_NAMES = ["网络与互联网", "显示与亮度", "声音与振动", "电池", "存储"];
  var ROW_VALS = ["已连接", "自动", "70%", "86%", "12 GB"];
  var ROW_ICONS = ["wifi", "user", "volume", "battery", "folder"];

  var state = {
    title: "系统设置",
    w: 280, h: 190, rows: 3,
    auto: false,
    showMin: true, showMax: true, showClose: true,
    geom: null, goal: null,
    closed: false, minimized: false, maximized: false,
    drag: null, hoverBtn: null
  };

  function normalRect(w, h) {
    w = Math.min(w, W - 12);
    h = Math.min(h, H - 12);
    return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
  }

  state.geom = normalRect(state.w, state.h);
  state.goal = normalRect(state.w, state.h);

  var view = K.view(document.getElementById("view"));
  view.resize(W, H);
  var canvas = view.canvas;
  var autoT0 = performance.now();
  var autoPhase = 0;

  function layoutButtons() {
    var bw = 22, bh = 20, gap = 5;
    var g = state.geom;
    var y = g.y + (HEADER - bh) / 2;
    var x = g.x + g.w - 8;
    var out = [];
    if (state.showClose) { x -= bw; out.push({ id: "close", x: x, y: y, w: bw, h: bh }); x -= gap; }
    if (state.showMax) { x -= bw; out.push({ id: "max", x: x, y: y, w: bw, h: bh }); x -= gap; }
    if (state.showMin) { x -= bw; out.push({ id: "min", x: x, y: y, w: bw, h: bh }); x -= gap; }
    return out;
  }

  function hitButton(e) {
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var bs = layoutButtons(), i, b;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
    }
    return null;
  }

  function inHeader(e) {
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var g = state.geom;
    return x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + HEADER;
  }

  function setMax(on) {
    state.maximized = on;
    if (on) {
      state.minimized = false;
      state.goal = { x: 6, y: 6, w: W - 12, h: H - 12 };
    } else {
      state.goal = normalRect(state.w, state.h);
    }
    state.drag = null;
  }

  function drawMaxIcon(c, b, restore) {
    c.save();
    c.strokeStyle = "#5b6470";
    c.lineWidth = 1.4;
    if (restore) {
      c.strokeRect(b.x + 6.5, b.y + 5, 8, 7);
      c.strokeRect(b.x + 9, b.y + 8.5, 8, 7);
    } else {
      c.strokeRect(b.x + 7.5, b.y + 5.5, 9, 9);
    }
    c.restore();
  }
  function drawButtons(c, g) {
    var bs = layoutButtons(), i, b, hot, isClose;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      hot = state.hoverBtn === b.id;
      isClose = b.id === "close";
      if (hot) {
        K.box(c, b.x, b.y, b.w, b.h, {
          bg: isClose ? "#fde8e8" : "#e4e9f0", radius: 5
        });
      }
      var col = (isClose && hot) ? "#e04b4b" : "#5b6470";
      if (b.id === "close") {
        K.icon(c, "close", b.x + b.w / 2 - 3.6, b.y + b.h / 2 - 5, 10, col);
      } else if (b.id === "min") {
        K.icon(c, "minus", b.x + b.w / 2 - 3.6, b.y + b.h / 2 - 5, 10, col);
      } else {
        drawMaxIcon(c, b, state.maximized);
      }
    }
  }

  function drawContent(c, g) {
    var top = g.y + HEADER;
    var hgt = g.h - HEADER;
    if (hgt <= 2) return;
    c.save();
    c.beginPath();
    c.rect(g.x + 1, top, g.w - 2, hgt - 1);
    c.clip();
    var i, rowY, rowH = 34;
    for (i = 0; i < state.rows; i++) {
      rowY = top + 6 + i * rowH;
      if (rowY > g.y + g.h) break;
      K.box(c, g.x + 12, rowY + 4, 24, 24, {
        bg: K.alpha(K.theme.primary, 0.10), radius: 7
      });
      K.icon(c, ROW_ICONS[i], g.x + 19, rowY + 10, 11, K.theme.primary);
      K.text(c, ROW_NAMES[i], g.x + 45, rowY + 16, {
        size: 12.5, color: K.theme.text
      });
      K.text(c, ROW_VALS[i], g.x + g.w - 14, rowY + 16, {
        size: 11, color: K.theme.textFaint, align: "right"
      });
      if (i < state.rows - 1) {
        c.save();
        c.strokeStyle = "#edf0f4";
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(g.x + 45, rowY + rowH - 1);
        c.lineTo(g.x + g.w - 14, rowY + rowH - 1);
        c.stroke();
        c.restore();
      }
    }
    c.restore();
  }

  function drawClosed(c) {
    var w = 214, h = 88, x = (W - w) / 2, y = (H - h) / 2;
    K.box(c, x, y, w, h, {
      bg: "#ffffff", radius: 12, borderWidth: 1, border: "#dfe4eb",
      shadow: K.alpha("#1c2128", 0.12), shadowBlur: 18, shadowY: 6
    });
    c.beginPath();
    c.arc(x + w / 2, y + 26, 13, 0, Math.PI * 2);
    c.fillStyle = "#fdeaea";
    c.fill();
    K.icon(c, "close", x + w / 2 - 4.3, y + 20, 12, "#e04b4b");
    K.text(c, "窗口已关闭", x + w / 2, y + 55, {
      size: 14, weight: 600, color: K.theme.text, align: "center"
    });
    K.text(c, "点击画布重新打开", x + w / 2, y + 73, {
      size: 11.5, color: K.theme.textFaint, align: "center"
    });
  }

  function drawScene(c) {
    c.clearRect(0, 0, W, H);
    c.fillStyle = "#ffffff";
    c.fillRect(0, 0, W, H);
    if (state.closed) { drawClosed(c); return; }
    var g = state.geom;
    var hh = state.minimized ? HEADER : g.h;

    K.box(c, g.x, g.y, g.w, hh, {
      bg: "#ffffff", radius: 10,
      shadow: K.alpha("#1c2128", 0.16), shadowBlur: 18, shadowY: 7
    });

    c.save();
    K.roundRectPath(c, g.x, g.y, g.w, hh, 10);
    c.clip();
    c.fillStyle = "#f2f5f9";
    c.fillRect(g.x, g.y, g.w, HEADER);
    c.fillStyle = "#e3e8ef";
    c.fillRect(g.x, g.y + HEADER - 1, g.w, 1);
    c.restore();

    K.text(c, state.title || " ", g.x + 13, g.y + HEADER / 2 + 1, {
      size: 13, weight: 600, color: "#2a3038"
    });

    drawButtons(c, g);
    if (!state.minimized) drawContent(c, g);

    K.box(c, g.x, g.y, g.w, hh, {
      radius: 10, borderWidth: 1, border: "#d6dce4"
    });
  }
  function renderCode() {
    var L = [];
    var i;
    L.push(K.cm("/* v10 中 lv_win 已标记 deprecated，但接口仍可用 */"));
    L.push("lv_obj_t * win = " + K.fn("lv_win_create") + "(lv_screen_active());");
    L.push(K.fn("lv_obj_set_size") + "(win, " + K.num(state.w) + ", " + K.num(state.h) + ");");
    L.push(K.fn("lv_obj_center") + "(win);");
    L.push(K.fn("lv_win_add_title") + "(win, " + JSON.stringify(state.title || "") + ");");
    if (state.showMin) L.push("lv_obj_t * btn_min = " + K.fn("lv_win_add_button") + "(win, LV_SYMBOL_MINUS, 24);");
    if (state.showMax) L.push("lv_obj_t * btn_max = " + K.fn("lv_win_add_button") + "(win, LV_SYMBOL_PLUS, 24);");
    if (state.showClose) L.push("lv_obj_t * btn_close = " + K.fn("lv_win_add_button") + "(win, LV_SYMBOL_CLOSE, 24);");
    L.push("lv_obj_t * header = " + K.fn("lv_win_get_header") + "(win);");
    L.push("lv_obj_t * content = " + K.fn("lv_win_get_content") + "(win);");
    L.push("");
    L.push(K.cm("/* 内容区条目 */"));
    for (i = 0; i < state.rows; i++) {
      L.push("lv_obj_t * row" + (i + 1) + " = " + K.fn("lv_label_create") + "(content);");
      L.push(K.fn("lv_label_set_text") + "(row" + (i + 1) + ", \"" + ROW_NAMES[i] + "\");");
      L.push(K.fn("lv_obj_align") + "(row" + (i + 1) + ", LV_ALIGN_TOP_LEFT, 12, " + K.num(8 + i * 34) + ");");
    }
    L.push("");
    L.push(K.cm("/* 当前窗口状态 */"));
    if (state.closed) {
      L.push(K.fn("lv_obj_add_flag") + "(win, LV_OBJ_FLAG_HIDDEN);");
    } else if (state.minimized) {
      L.push(K.fn("lv_obj_set_height") + "(win, " + K.num(HEADER) + ");");
    } else if (state.maximized) {
      L.push(K.fn("lv_obj_set_size") + "(win, " + K.num(W - 12) + ", " + K.num(H - 12) + ");");
      L.push(K.fn("lv_obj_center") + "(win);");
    } else {
      L.push(K.cm("/* 普通尺寸，位于画布中心 */"));
    }
    K.code(L);
  }

  var lastT = performance.now();
  K.run(function (now) {
    var dt = Math.min(60, now - lastT);
    lastT = now;
    if (state.auto && !state.closed) {
      var phase = Math.floor((now - autoT0) / 1800) % 2;
      if (phase !== autoPhase) {
        autoPhase = phase;
        setMax(phase === 1);
        renderCode();
      }
    }
    var k = 1 - Math.exp(-dt / 70);
    var g = state.geom, t = state.goal;
    g.x += (t.x - g.x) * k;
    g.y += (t.y - g.y) * k;
    g.w += (t.w - g.w) * k;
    g.h += (t.h - g.h) * k;
    drawScene(view.ctx);
  });
  function reopen() {
    state.closed = false;
    state.minimized = false;
    state.maximized = false;
    state.geom = normalRect(state.w, state.h);
    state.goal = normalRect(state.w, state.h);
    state.drag = null;
    renderCode();
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (e.button && e.button !== 0) return;
    if (state.closed) { reopen(); return; }
    var id = hitButton(e);
    if (id) {
      if (id === "close") {
        state.closed = true;
        state.auto = false;
        document.getElementById("auto").checked = false;
      } else if (id === "min") {
        state.minimized = !state.minimized;
      } else {
        setMax(!state.maximized);
      }
      renderCode();
      return;
    }
    if (inHeader(e) && !state.maximized) {
      var g = state.geom;
      state.drag = { sx: e.clientX, sy: e.clientY, gx: g.x, gy: g.y };
      state.goal.x = g.x;
      state.goal.y = g.y;
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = "grabbing";
    }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (state.drag) {
      var g = state.geom;
      var dx = e.clientX - state.drag.sx;
      var dy = e.clientY - state.drag.sy;
      g.x = K.clamp(state.drag.gx + dx, 0, Math.max(0, W - g.w));
      g.y = K.clamp(state.drag.gy + dy, 0, H - HEADER);
      state.goal.x = g.x;
      state.goal.y = g.y;
      return;
    }
    state.hoverBtn = state.closed ? null : hitButton(e);
    canvas.style.cursor = state.hoverBtn ? "pointer" : "default";
  });

  function endDrag() {
    state.drag = null;
    canvas.style.cursor = "default";
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  document.getElementById("title").addEventListener("input", function (e) {
    state.title = e.target.value;
    renderCode();
  });

  K.bindRange("w", function (v) { return v + " px"; }, function (v) {
    state.w = v;
    if (!state.maximized && !state.closed) {
      state.goal = normalRect(state.w, state.h);
    }
    renderCode();
  });

  K.bindRange("h", function (v) { return v + " px"; }, function (v) {
    state.h = v;
    if (!state.maximized && !state.closed) {
      state.goal = normalRect(state.w, state.h);
    }
    renderCode();
  });

  K.bindRange("rows", function (v) { return v; }, function (v) {
    state.rows = v;
    renderCode();
  });

  K.bindCheck("auto", function (on) {
    state.auto = on;
    autoT0 = performance.now();
    autoPhase = 0;
    if (on) {
      setMax(false);
      renderCode();
    }
  });

  K.bindCheck("show-min", function (on) { state.showMin = on; renderCode(); });
  K.bindCheck("show-max", function (on) { state.showMax = on; renderCode(); });
  K.bindCheck("show-close", function (on) { state.showClose = on; renderCode(); });

  document.getElementById("btn-png").addEventListener("click", function () {
    K.exportPng(canvas, "win.png");
  });

  renderCode();
})();
</script>
</body>
</html>
